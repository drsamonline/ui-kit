<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ui-kit — TodoMVC, built on the kit</title>
<style>
  :root{--bg:#f5f5f5;--fg:#4d4d4d;--mut:#999;--acc:#b83f45;--line:#ededed}
  @media (prefers-color-scheme: dark){:root{--bg:#1a1a1a;--fg:#e8e8e8;--mut:#777;--line:#333}}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Arial,sans-serif}
  main{max-width:550px;margin:0 auto;padding:32px 16px}
  h1{font-size:80px;font-weight:200;text-align:center;color:var(--acc);margin:0 0 8px}
  .kit{text-align:center;color:var(--mut);margin:0 0 24px;font-size:12px}
  input.new-todo{width:100%;box-sizing:border-box;padding:16px;font-size:24px;border:1px solid var(--line);background:transparent;color:inherit;outline:none}
  ul{list-style:none;margin:0;padding:0}
  .todo-list li{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid var(--line)}
  .todo-list li.completed label{text-decoration:line-through;color:var(--mut)}
  .todo-list label{flex:1}
  .destroy{border:0;background:none;color:var(--acc);cursor:pointer;font-size:16px}
  .footer{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;color:var(--mut);font-size:12px}
  .filters{display:flex;gap:8px;list-style:none;margin:0;padding:0}
  .filters a{color:inherit;text-decoration:none;padding:2px 6px;border-radius:4px}
  .filters a.selected{border:1px solid var(--acc)}
  .clear-completed{border:0;background:none;color:inherit;cursor:pointer}
  .main{display:none}
</style>
</head>
<body>
<main>
  <h1>todos</h1>
  <p class="kit">TodoMVC, built on ui-kit — signals, computed, effects, hyperscript, a keyed list, a router</p>
  <div id="app"></div>
</main>
<script src="ui-kit.js"></script>
<script src="examples/todomvc.js"></script>
<script>
  window.UI.doc = document;
  window.TodoMVC.create(document.getElementById("app"), { window: window });
</script>
</body>
</html>
